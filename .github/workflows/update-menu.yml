name: Update Cafeteria Menu

on:
  schedule:
    # JST 月〜土 08:30（UTC 日〜金 23:30）
    - cron: "30 23 * * 0-5"
  workflow_dispatch:
    inputs:
      force_reparse:
        description: "画像が同じでもGeminiで読み直す"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-menu
  cancel-in-progress: false

jobs:
  update-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # rapidocr は初回にOCRモデルをダウンロードするので、それもキャッシュする
      - name: Cache OCR models
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}/lib/python3.11/site-packages/rapidocr/models
          key: rapidocr-models-v5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetch_menu.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 任意: 公開ページURL（通知にリンクが付く）、使うGeminiモデルの順番
          SITE_URL: ${{ vars.SITE_URL }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          FORCE_REPARSE: ${{ inputs.force_reparse && '1' || '' }}
        run: python fetch_menu.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu.json dishes.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update cafeteria menu"
            git pull --rebase origin main
            git push
          fi
