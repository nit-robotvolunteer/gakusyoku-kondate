name: Update Cafeteria Menu

on:
  schedule:
    # 毎日 JST 08:30 (UTC 23:30) に実行
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai pillow rapidocr_onnxruntime

      - name: Run fetch_menu.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_menu.py

      - name: Commit and push updated menu.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update cafeteria menu.json"
            git pull --rebase origin main
            git push
          fi
